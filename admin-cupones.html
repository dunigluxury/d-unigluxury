<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Cupones D'UNIG LUXURY</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #1a1216 0%, #0a0507 100%); background-color: #050204; }
        .font-futurista { font-family: 'Orbitron', sans-serif; }
        .glow-gold { box-shadow: 0 0 30px rgba(229, 193, 88, 0.15); }
        .glass-panel { background: linear-gradient(135deg, rgba(28, 20, 24, 0.45) 0%, rgba(12, 8, 10, 0.6) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.02); }
        .grid-bg { background-image: linear-gradient(rgba(229, 193, 88, 0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(229, 193, 88, 0.01) 1px, transparent 1px); background-size: 32px 32px; }
        ::-webkit-scrollbar { width: 4px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5c158; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    </style>
</head>
<body class="text-stone-200 antialiased min-h-screen flex flex-col justify-between grid-bg p-4 sm:p-8">

    <header class="max-w-4xl mx-auto w-full flex items-center justify-between border-b border-stone-900 pb-6 mb-8">
        <div class="flex items-center space-x-3">
            <div class="border border-amber-500/30 p-2.5 rounded-xl bg-stone-950/80 glow-gold text-amber-400">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-black tracking-[0.2em] text-white font-futurista">PANEL <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-500">ADMIN</span></h1>
                <p class="text-[9px] text-amber-500/70 uppercase tracking-[0.3em] font-bold font-futurista">CONTROL DE BÓVEDA</p>
            </div>
        </div>
        <a href="cuponera.html" class="bg-stone-900 border border-stone-800 text-stone-300 hover:text-white px-3.5 py-2 rounded-xl text-[10px] uppercase font-futurista font-bold tracking-wider transition-all flex items-center gap-2">
            <i data-lucide="eye" class="w-3.5 h-3.5"></i> Ver Cuponera
        </a>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-grow space-y-8">
        <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-stone-800 glow-gold space-y-6">
            <div>
                <h2 class="text-lg font-black font-futurista text-white tracking-wide">Registrar / Actualizar Cupón</h2>
                <p class="text-xs text-stone-400 font-mono mt-1">Configura o rellenar una casilla de la suerte.</p>
                <p id="status-conexion" class="text-red-400 text-[10px] font-mono mt-2 font-bold"></p>
            </div>

            <form id="form-cupone-admin" onsubmit="guardarCupon(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Número de Casilla (1 al 20)</label>
                        <input type="number" id="num-casilla" min="1" max="20" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-amber-500 outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Categoría</label>
                        <select id="categoria-cupone" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-amber-500 outline-none">
                            <option value="Bienvenida">Bienvenida</option>
                            <option value="Oferta 2x1">Oferta 2x1</option>
                            <option value="Oferta 3x2">Oferta 3x2</option>
                            <option value="Bebidas Gratis">Bebidas Gratis</option>
                            <option value="Tendencia">Tendencia</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Título del Premio</label>
                        <input type="text" id="titulo-cupone" placeholder="Ej: 2x1 en Experiencias VIP" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-amber-500 outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Código de Canje</label>
                        <input type="text" id="codigo-cupone" placeholder="Ej: DUNIG-2X1VIP" required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-amber-500 outline-none">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Descripción del Premio</label>
                    <textarea id="desc-cupone" rows="3" placeholder="Detalles de lo que incluye el beneficio..." required class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-xs text-white font-mono focus:border-amber-500 outline-none resize-none"></textarea>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] font-futurista font-bold uppercase text-stone-400">Imagen Ilustrativa del Cupón (Opcional)</label>
                    <input type="file" id="imagen-cupone" accept="image/*" class="w-full bg-stone-950 border border-stone-800 rounded-xl px-4 py-2.5 text-xs text-stone-400 font-mono file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-amber-500 file:text-black hover:file:bg-amber-400 cursor-pointer">
                </div>

                <button type="submit" id="btn-guardar" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-black font-futurista font-black py-4 rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-lg hover:scale-[1.01] transition-all">
                    Guardar / Actualizar Cupón
                </button>
            </form>
        </div>

        <div class="space-y-4">
            <h3 class="text-sm font-futurista font-bold uppercase tracking-wider text-white">Casillas Registradas</h3>
            <div id="lista-admin-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <p class="text-xs text-stone-400 font-mono col-span-full text-center py-4">Cargando... (Si no carga, revisa tus credenciales en el código)</p>
            </div>
        </div>
    </main>

    <footer class="max-w-4xl mx-auto w-full border-t border-stone-900/80 mt-16 pt-6 text-center text-xs text-stone-500 font-mono tracking-widest">
        <p>© 2026 D'UNIG LUXURY ECOSISTEMA. GESTIÓN MÓVIL.</p>
    </footer>

    <script>
        // -- CONFIGURACIÓN CRÍTICA: COLOCA TUS DATOS REALES AQUÍ --
        const SUPABASE_URL = 'https://TU-URL-REAL.supabase.co'; // <--- COPIAR DE SUPABASE API
        const SUPABASE_KEY = 'TU-ANON-KEY-REAL';       // <--- COPIAR DE SUPABASE API
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            // Verificar si las llaves son dummy
            if (SUPABASE_URL.includes('TU-URL-REAL')) {
                document.getElementById('status-conexion').innerText = "ERROR CRÍTICO: No has configurado la URL de Supabase en el código de admin-cupones.html. El fetch fallará.";
                return;
            }
            
            cargarCuponesAdmin();
            lucide.createIcons();
        });

        async function cargarCuponesAdmin() {
            try {
                const { data, error } = await supabaseClient
                    .from('cupones')
                    .select('*')
                    .order('numero_casilla', { ascending: true });

                const contenedor = document.getElementById('lista-admin-grid');
                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = `<p class="text-xs text-stone-400 font-mono col-span-full text-center py-4">No hay cupones registrados aún.</p>`;
                    return;
                }

                contenedor.innerHTML = data.map(c => `
                    <div class="glass-panel p-4 rounded-2xl border border-stone-800 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            ${c.imagen_url ? `<img src="${c.imagen_url}" class="w-12 h-12 object-cover rounded-xl border border-stone-700">` : `<div class="w-12 h-12 rounded-xl bg-stone-950 border border-stone-800 flex items-center justify-center text-amber-400 font-futurista font-bold text-xs">#${c.numero_casilla}</div>`}
                            <div>
                                <span class="text-[9px] font-mono text-amber-400 uppercase tracking-widest">Casilla #${c.numero_casilla} - ${c.categoria}</span>
                                <h4 class="text-xs font-bold text-white font-futurista">${c.titulo}</h4>
                                <span class="text-[10px] text-stone-500 font-mono">${c.codigo}</span>
                            </div>
                        </div>
                        <button onclick="eliminarCupon(${c.id})" class="text-stone-500 hover:text-red-400 p-2 transition-colors cursor-pointer">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch (err) {
                console.error("Error al cargar:", err);
                document.getElementById('lista-admin-grid').innerHTML = `<p class="text-xs text-red-400 font-mono col-span-full text-center py-4">Error al conectar: ${err.message}. Revisa la consola de tu navegador (F12).</p>`;
            }
        }

        async function guardarCupon(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            btn.innerText = "Procesando...";
            btn.disabled = true;

            const numCasilla = parseInt(document.getElementById('num-casilla').value);
            const categoria = document.getElementById('categoria-cupone').value;
            const titulo = document.getElementById('titulo-cupone').value;
            const codigo = document.getElementById('codigo-cupone').value;
            const descripcion = document.getElementById('desc-cupone').value;
            const fileInput = document.getElementById('imagen-cupone');

            try {
                let imagenUrl = null;

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const timestamp = Date.now();
                    const fileExt = file.name.split('.').pop
