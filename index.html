<!-- CAPA DE BLOQUEO Y BOTÓN FLOTANTE DE NEGOCIO CERRADO -->
<div id="modal-negocio-cerrado" class="fixed inset-0 bg-stone-950/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center">
    <div class="max-w-md w-full bg-stone-900 border border-red-500/30 p-8 rounded-3xl shadow-2xl space-y-6 animate-pulse">
        <div class="w-20 h-20 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto text-3xl">
            🔒
        </div>
        <div class="space-y-2">
            <h2 class="text-2xl font-bold text-white uppercase tracking-wider font-futurista">¡Negocio Cerrado Temporalmente!</h2>
            <p class="text-stone-400 text-xs leading-relaxed">En este momento no estamos recibiendo pedidos online. Vuelve a visitarnos más tarde o comunícate con nosotros.</p>
        </div>
        <div class="pt-2">
            <span class="inline-block bg-red-500/10 text-red-400 border border-red-500/20 font-mono text-xs px-4 py-2 rounded-xl">
                ESTADO: CERRADO DESDE EL PANEL
            </span>
        </div>
    </div>
</div>

<!-- BOTÓN FLOTANTE PERMANENTE CUANDO ESTÁ CERRADO -->
<div id="btn-flotante-cerrado" class="fixed bottom-6 right-6 z-40 hidden">
    <button onclick="mostrarAvisoCerrado()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs uppercase px-5 py-3 rounded-2xl shadow-lg border border-red-400/40 flex items-center gap-3 transition-transform hover:scale-105 cursor-pointer animate-bounce">
        <span class="w-3 h-3 bg-white rounded-full animate-ping"></span>
        <span>🔴 Negocio Cerrado (Ver Aviso)</span>
    </button>
</div>
