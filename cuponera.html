<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuponera Exclusiva - D'UNIG LUXURY</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;300;400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at 50% 0%, #1a1216 0%, #0a0507 100%); background-color: #050204; }
        .font-futurista { font-family: 'Orbitron', sans-serif; }
        .glow-gold { box-shadow: 0 0 30px rgba(229, 193, 88, 0.15); }
        .glass-panel { background: linear-gradient(135deg, rgba(28, 20, 24, 0.45) 0%, rgba(12, 8, 10, 0.6) 100%); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.02); }
        .grid-bg { background-image: linear-gradient(rgba(229, 193, 88, 0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(229, 193, 88, 0.01) 1px, transparent 1px); background-size: 32px 32px; }
        ::-webkit-scrollbar { width: 4px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5c158; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
    </style>
</head>
<body class="text-stone-200 antialiased min-h-screen flex flex-col justify-between grid-bg p-4 sm:p-8">

    <!-- ENCABEZADO -->
    <header class="max-w-5xl mx-auto w-full flex items-center justify-between border-b border-stone-900 pb-6 mb-8">
        <div class="flex items-center space-x-4">
            <div class="border border-amber-500/30 p-2.5 rounded-xl bg-stone-950/80 glow-gold text-amber-400">
                <i data-lucide="crown" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-black tracking-[0.2em] text-white font-futurista">D'UNIG <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-500">LUXURY</span></h1>
                <p class="text-[9px] text-amber-500/70 uppercase tracking-[0.3em] font-bold font-futurista">BÓVEDA DE CUPONES VIP (SUPABASE)</p>
            </div>
        </div>
        <a href="index.html" class="bg-stone-900 border border-stone-800 text-stone-300 hover:text-white px-4 py-2 rounded-xl text-[10px] uppercase font-futurista font-bold tracking-wider transition-all flex items-center gap-2">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver a la Vitrina
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL: 20 CASILLAS -->
    <main class="max-w-5xl mx-auto w-full flex-grow space-y-8">
        <div class="text-center space-y-2">
            <h2 class="text-2xl sm:text-3xl font-black font-futurista text-white tracking-wide">Selecciona tu Casilla de la Suerte</h2>
            <p class="text-xs text-stone-400 font-mono">Los beneficios son administrados de forma segura desde tu base de datos.</p>
        </div>

        <!-- INDICADOR DE CARGA -->
        <div id="loading-cupones" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-xs text-amber-400 font-mono tracking-widest uppercase">Sincronizando bóveda segura...</p>
        </div>

        <!-- GRID DE 20 CASILLAS -->
        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4 hidden" id="grid-cupones"></div>
    </main>

    <!-- MODAL DE PREMIO REVELADO -->
    <div id="modal-premio" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 rounded-3xl border border-stone-800 space-y-6 relative glow-gold text-center">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-2xl mx-auto flex items-center justify-center text-amber-400 glow-gold">
                <i data-lucide="gift" class="w-8 h-8"></i>
            </div>
            <div class="space-y-2">
                <span id="premio-categoria" class="text-[10px] uppercase tracking-wider bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1 rounded-xl font-futurista font-bold"></span>
                <h3 id="premio-titulo" class="text-lg sm:text-xl font-black font-futurista text-white tracking-wide mt-2"></h3>
                <p id="premio-descripcion" class="text-xs text-stone-300 font-mono leading-relaxed"></p>
            </div>
            <div class="bg-stone-950 border border-stone-800 p-4 rounded-xl space-y-1">
                <span class="text-[9px] uppercase text-stone-500 font-bold font-futurista block">Código de Canje Verificado</span>
                <span id="premio-codigo" class="text-sm font-mono font-bold text-amber-400 tracking-widest"></span>
            </div>
            <div class="flex gap-3">
                <button onclick="cerrarModalPremio()" class="w-full bg-stone-900 border border-stone-800 text-stone-300 hover:text-white font-futurista font-bold p-3.5 rounded-xl text-xs uppercase tracking-wider transition-colors cursor-pointer">
                    Cerrar
                </button>
                <button onclick="reclamarPorWhatsApp()" class="w-full bg-amber-500 text-black font-futurista font-black p-3.5 rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-lg hover:bg-amber-400 transition-colors flex items-center justify-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4"></i> Reclamar
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="max-w-5xl mx-auto w-full border-t border-stone-900/80 mt-16 pt-6 text-center text-xs text-stone-500 font-mono tracking-widest">
        <p>© 2026 D'UNIG LUXURY ECOSISTEMA. CUPONERA SEGURA SUPABASE.</p>
    </footer>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Asegúrate de colocar tus credenciales reales)
        const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
        const SUPABASE_KEY = 'TU-ANON-KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let listaCuponesDB = [];
        let cuponSeleccionado = null;

        window.addEventListener('DOMContentLoaded', () => {
            descargarCuponesDeSupabase();
        });

        async function descargarCuponesDeSupabase() {
            const { data, error } = await supabaseClient
                .from('cupones')
                .select('*')
                .eq('activo', true)
                .order('numero_casilla', { ascending: true });

            document.getElementById('loading-cupones').classList.add('hidden');

            if (!error && data) {
                listaCuponesDB = data;
                renderizarCasillas();
            } else {
                console.error("Error al cargar cupones:", error);
                document.getElementById('grid-cupones').innerHTML = `<p class="col-span-full text-center text-red-400 text-xs font-mono">Error al conectar con la bóveda de Supabase.</p>`;
                document.getElementById('grid-cupones').classList.remove('hidden');
            }
        }

        function renderizarCasillas() {
            const grid = document.getElementById('grid-cupones');
            grid.classList.remove('hidden');
            
            // Genera las casillas del 1 al 20 basándose en los datos reales de la base de datos
            grid.innerHTML = listaCuponesDB.map((c) => `
                <div onclick="abrirCasilla(${c.numero_casilla})" class="glass-panel h-36 rounded-2xl border border-stone-900 hover:border-amber-500/50 p-4 flex flex-col justify-between items-center text-center cursor-pointer group transition-all duration-300 hover:scale-105">
                    <span class="text-[10px] font-mono text-stone-500 group-hover:text-amber-400">Casilla #${c.numero_casilla}</span>
                    <div class="w-12 h-12 rounded-xl bg-stone-950 border border-stone-800 flex items-center justify-center text-amber-400 group-hover:bg-amber-500 group-hover:text-black transition-colors">
                        <i data-lucide="lock" class="w-5 h-5 group-hover:hidden"></i>
                        <i data-lucide="unlock" class="w-5 h-5 hidden group-hover:block"></i>
                    </div>
                    <span class="text-[10px] font-futurista uppercase font-bold text-stone-300 tracking-wider">${c.categoria}</span>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function abrirCasilla(numCasilla) {
            cuponSeleccionado = listaCuponesDB.find(item => item.numero_casilla === numCasilla);
            if(!cuponSeleccionado) return;

            document.getElementById('premio-categoria').innerText = cuponSeleccionado.categoria;
            document.getElementById('premio-titulo').innerText = cuponSeleccionado.titulo;
            document.getElementById('premio-descripcion').innerText = cuponSeleccionado.descripcion;
            document.getElementById('premio-codigo').innerText = cuponSeleccionado.codigo;
            document.getElementById('modal-premio').classList.remove('hidden');
            lucide.createIcons();
        }

        function cerrarModalPremio() {
            document.getElementById('modal-premio').classList.add('hidden');
        }

        function reclamarPorWhatsApp() {
            if(!cuponSeleccionado) return;
            // Número de WhatsApp al que llegará el pedido/cupón (puedes cambiarlo si usas otra variable)
            const numeroWhatsApp = "584120000000"; 
            const mensaje = `💎 *CANJE DE CUPÓN - D'UNIG LUXURY* 💎\n\n🎁 *PREMIO:* ${cuponSeleccionado.titulo}\n🏷️ *CATEGORÍA:* ${cuponSeleccionado.categoria}\n🔢 *CÓDIGO:* ${cuponSeleccionado.codigo}\n\n¡Hola! He destapado este cupón en la bóveda digital y deseo validarlo.`;
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=${numeroWhatsApp}&text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>
</html>
